name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff -r api/requirements.txt -r api/tests/requirements.txt -r functions/requirements.txt
      - run: ruff check .
      - run: PYTHONPATH=functions python -m pytest -q api/tests functions/tests
      - name: Vérifier les trois fonctions déclarées
        run: PYTHONPATH=functions python -c 'import function_app as f; assert {x.get_function_name() for x in f.app.get_functions()} == {"dispatcher","worker","recent"}'
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tauzinflavio/projet-dscc/api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
      - name: Vérifier la taille, la santé et le commit
        run: |
          bytes=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Size}}')
          echo "Taille de l’image : $bytes octets" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 500000000
          docker run -d --name wine -p 127.0.0.1:8000:8000 "$IMAGE:$GITHUB_SHA"
          curl -fsS --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          curl -fsS http://localhost:8000/version | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:1.0.0"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:1.0.0"
